<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        nav{
            height: 80px;
            border-bottom: 1px solid;
            background-color: orange;
            transition: .5s;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
        }
        .show{
            /* nav 보여주기 */
            height: 80px;
        }

        .hide{
            /* nav 숨기기 */
            height: 0px;
        }
        main>section{
            height: 600px;
            background-color: royalblue;
        }
    </style>
</head>
<body style="height: 5000px; margin: 0; padding: 0; width: 8000px;">


    <div class="wrapper">
        <header class="top-header"></header>
        <nav></nav>
    </div>
    <main>
        <section></section>
    </main>
    <footer></footer>

    <script>
        const navEl = document.querySelector('.wrapper nav');
        let scrollState =0;
        document.addEventListener('scroll',()=>{
            // window.scrollY : ViewPort를 기준으로 가장 위쪽 부분의 세로축 위치
            // console.log('scrollY...',window.scrollY);
            // console.log('scrollTop...',document.documentElement.scrollTop);
            // console.log('scrollHeight...',document.documentElement.scrollHeight); //문서의 높이

            // window.scrollY : ViewPort를 기준으로 가장 위쪽 부분의 세로축 위치
            // console.log('scrollX...',window.scollX);
            // console.log('scrollX...',document.documentElement.scrollLeft);
            
            // 스크롤값이 1000이상인 상태에서 스크롤을 위로 올렸을때 보여줘
            // 상태값 담기위한 변수 : let scrollstate
            // 상태값은 언제 저장할지
            // window.scrollY>=1000 && scrollstate>window.scrollY

            // 헤더스타일변경
            if(window.scrollY>=30)
            {
                navEl.classList.remove('show');
                navEl.classList.add('hide');
            }
            else if(window.scrollY>=1000 && scrollstate>window.scrollY)
            {
                navEl.classList.remove('hide');
                navEl.classList.add('show');
            }
            else
            {
                navEl.classList.remove('hide');
                navEl.classList.add('show');
            }
            scrollState = window.scrollY;

        })
    </script>
</body>
</html>
