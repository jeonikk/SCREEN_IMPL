<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>점수 계산기</title>
</head>
<body>
    <div>
        <label>국어점수 : </label>
        <input class="korea" type="text" name="국어">
        <button onclick="myScore.save국어()">저장</button>
    </div>
    <div>
        <label>영어점수 : </label>
        <input class="english" type="text" name="영어">
        <button onclick="myScore.save영어()">저장</button>
    </div>
    <div>
        <label>수학점수 : </label>
        <input class="math" type="text" name="수학">
        <button onclick="myScore.save수학()">저장</button>
    </div>
    <hr />
    총합 : <div class="sum-block"></div> 
    <button onClick="myScore.sum()">확인</button><br />

    평균 : <div class="avg-block"></div> 
    <button onClick="myScore.avg()">확인</button><br />

    <script>
        const myScore = {
            국어: 0,
            영어: 0,
            수학: 0,
            총점: 0,
            평균: 0,

            save국어: function () {
                const 국어input = document.querySelector('.korea');
                this.국어 = parseInt(국어input.value) || 0;
                console.log('국어점수 : ', this.국어);
            },

            save영어: function () {
                const 영어input = document.querySelector('.english');
                this.영어 = parseInt(영어input.value) || 0;
                console.log('영어점수 : ', this.영어);
            },

            save수학: function () {
                const 수학input = document.querySelector('.math');
                this.수학 = parseInt(수학input.value) || 0;
                console.log('수학점수 : ', this.수학);
            },

            sum: function () {
                this.총점 = this.국어 + this.영어 + this.수학;
                const sumBlock = document.querySelector('.sum-block');
                sumBlock.innerHTML = this.총점;
            },

            avg: function () {
                this.평균 = this.총점 / 3;
                const avgBlock = document.querySelector('.avg-block');
                avgBlock.innerHTML = this.평균.toFixed(2); // 소수점 2자리까지 표시
            },
        }
    </script>
</body>
</html>
