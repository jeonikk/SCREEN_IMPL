<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <!-- google icon -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <style>
    .material-symbols-outlined {
      font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 48;

      font-size: 2.5rem;
      border: 3px solid;
      border-radius: 50%;
    }
  </style>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
  <style>
    * {}

    body {
      margin: 0;
      padding: 0;
    }

    .wrapper {}

    .wrapper>.header {
      height: 80px;
      background-color: white;

    }

    .wrapper>header>.top-header {
      height: 30px;
    }

    .wrapper>header>.top-header>.swiper {
      height: 100%;
      background-color: bisque;
    }

    .wrapper>header>.top-header>.swiper>.swiper-wrapper {}

    .wrapper>header>.top-header>.swiper>.swiper-wrapper>.swiper-slide {}

    .wrapper>header>.top-header>.swiper>.swiper-wrapper>.swiper-slide>a {}


    .wrapper>main {}

    .wrapper>main>section {}

    .wrapper>main>section.banner>.swiper {
      min-height: 720px;
      position: relative;
    }

    .wrapper>main>section.banner>.swiper>.swiper-wrapper {
      height: 100%;
    }

    .wrapper>main>section.banner>.swiper>.swiper-wrapper>.swiper-slide {
      height: 100%;
    }

    .wrapper>main>section.banner>.swiper .swiper-pagination-bullet {
      width: 10px;
      height: 10px;
      border-radius: 0;
      transition: .3s;
    }

    .wrapper>main>section.banner>.swiper .swiper-pagination-bullet-active {
      width: 15px;
      height: 15px;
      background-color: white;
    }

    .wrapper>main>section.banner>.swiper .swiper-pagination {
      color: white;
      font-size: 1.3rem;
      position: absolute;
      left: 15.625vw;
      top: 80%;
      width: 300px;
      letter-spacing: 3px;
    }

    .wrapper>main>section.banner>.swiper .swiper-pagination-current {
      color: royalblue;
    }

    .swiper-pagination-total {}


    .wrapper>main>section.banner>.swiper .swiper-button-next,
    .wrapper>main>section.banner>.swiper .swiper-button-prev {
      width: 50px;
      height: 50px;
      /* border: 1px solid white; */
      border-radius: 50%;
      position: absolute;
      top: 82%;
    }

    .wrapper>main>section.banner>.swiper .swiper-button-next {
      left: calc(15.625vw + 180px);
    }

    .wrapper>main>section.banner>.swiper .swiper-button-prev {
      left: calc(15.625vw + 65px);
    }

    .wrapper>main>section.banner>.swiper .swiper-button-next::after,
    .wrapper>main>section.banner>.swiper .swiper-button-prev::after {
      font-size: 1.3rem;
      font-weight: 800;
      color: white;
    }

    .wrapper>main>section.banner>.swiper .start-stop-toggle {
      position: absolute;
      top: 79%;
      left: calc(15.625vw + 10px);
      z-index: 100;
      cursor: pointer;
      color: white;
    }

    /* .swiper-scrollbar{ // 슬라이드 하단 스크롤바
      color: white;
    } */

    .wrapper>main>section.banner>.swiper>.swiper-wrapper>.swiper-slide>a {}

    .wrapper>main>section.banner>.swiper>.swiper-wrapper>.swiper-slide>a>img {}
  </style>
</head>

<body>
  <div class="wrapper"></div>
  <header>
    <div class="top-header">
      <!-- Slider main container -->
      <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide"><a href="javascript:void(0)">[공지] 오늘휴강입니다</a></div>
          <div class="swiper-slide"><a href="javascript:void(0)">[공지] 공지사항1</a></div>
          <div class="swiper-slide"><a href="javascript:void(0)">[공지] 공지사항2</a></div>
          <div class="swiper-slide"><a href="javascript:void(0)">[공지] 공지사항3</a></div>

        </div>
      </div>
      <nav></nav>
  </header>
  <main>
    <section class="banner">
      <!-- Slider main container -->
      <div class="swiper">
        <!-- Additional required wrapper -->
        <div class="swiper-wrapper">
          <!-- Slides -->
          <div class="swiper-slide">
            <a href="javascript:void(0)">
              <img src="./images/1.jpg" alt="">
            </a>
          </div>
          <div class="swiper-slide">
            <a href="javascript:void(0)">
              <img src="./images/2.jpg" alt="">
            </a>
          </div>
          <div class="swiper-slide">
            <a href="javascript:void(0)">
              <img src="./images/3.jpg" alt="">
            </a>
          </div>
          <div class="swiper-slide">
            <a href="javascript:void(0)">
              <img src="./images/4.jpg" alt="">
            </a>
          </div>

        </div>
        <!-- If we need pagination -->
        <div class="swiper-pagination"></div>

        <!-- If we need navigation buttons -->
        <div class="swiper-button-prev"></div>
        <div class="swiper-button-next"></div>

        <!-- stop/start button -->
        <div class="start-stop-toggle">
          <span class="material-symbols-outlined">
            play_arrow
          </span>
        </div>
        <!-- If we need scrollbar -->
        <!-- <div class="swiper-scrollbar"></div> -->
      </div>
    </section>
  </main>

  <script>
    const swiperBanner = new Swiper('.swiper', {
      // Optional parameters
      direction: 'horizontal', // horizontal(수평 slide) , valtical(수직 slide)
      autoplay: {
        delay: 2000,
        // pauseOnMouseEnter : true,
      },

      loop: true,
      effct: "slide", // slide (기본),fade,scroll,cube,coverflow,flip
      mousewheel: true,
      // If we need pagination
      pagination: {
        el: '.swiper-pagination',
        clickable: true,
        type: 'fraction', //bullets(기본), fraction, progrssbar
      },

      // Navigation arrows
      navigation: {
        nextEl: '.swiper-button-next',
        prevEl: '.swiper-button-prev',
      },

      // And if we need scrollbar // 슬라이드 하단 스크롤바
      // scrollbar: {
      //   el: '.swiper-scrollbar', 
      // },

    })

    // 토글버튼 만들기
    const playPauseBtn = document.querySelector('.start-stop-toggle span');
    let isPlaying = true;
    playPauseBtn.addEventListener('click', () => {
      if (isPlaying) {
        playPauseBtn.innerHTML = 'pause';
        swiperBanner.autoplay.stop();
        isPlaying = false;
      } else {
        playPauseBtn.innerHTML = 'play_arrow';
        swiperBanner.autoplay.start();
        isPlaying = true;

      }
    });

    //공지사항 Swiper
    const noticeSwiper = new Swiper('.top-header .swiper', {
      // Optional parameters
      direction: 'vertical',
      autoplay: {
        delay: 2000,
      },
      loop: true,
      mousewheel: true,

    });

  </script>

</body>

</html>
